name: test

on:
  push:
    branches: ["**"]   # tags are tested by the release workflow
  pull_request:
  workflow_call:       # used by release.yml

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh, cowsay and fish (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq zsh cowsay fish
          echo /usr/games >> "$GITHUB_PATH"

      - name: Install cowsay, fish and bash 5 (macOS)
        if: runner.os == 'macOS'
        run: brew install cowsay fish bash   # bash 5, alongside macOS's /bin/bash 3.2

      - name: Syntax check
        run: |
          zsh -n pratchett.plugin.zsh _pratchett
          sh -n bin/pratchett
          bash -n completions/pratchett.bash
          fish --no-execute completions/pratchett.fish

      - name: Command tests
        run: python3 tests/test_pratchett.py

      - name: Tab-completion tests (zsh, bash, fish)
        env:
          PRATCHETT_REQUIRE_SHELLS: bash fish
        run: python3 tests/test_completion.py

      - name: Homebrew formula template renders to valid Ruby
        run: |
          sed -e 's/@VERSION@/0.0.0/' -e 's/@SHA256@/0000/' packaging/homebrew/pratchett.rb | ruby -c
